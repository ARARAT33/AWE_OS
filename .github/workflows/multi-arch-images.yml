name: AWEOS Multi-Architecture Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-arch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-multi-arch-images:
    name: Build Multi-Arch Boot Images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-multiarch-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-multiarch-cargo-

      - name: Install boot image and emulator tools
        run: sudo apt-get update && sudo apt-get install -y grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build AWEOS Boot Images
        run: ./scripts/build-images.sh

      - name: Verify Image Artifacts
        run: |
          test -f dist/aweos-x86_64.iso
          test -f dist/aweos-x86_64.img
          test -f dist/aweos-uefi.img
          test -f dist/aweos-bios.img
          echo "All multi-architecture boot image artifacts generated successfully."

      - name: Upload Multi-Arch Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aweos-multiarch-boot-images
          path: |
            dist/aweos-x86_64.iso
            dist/aweos-x86_64.img
            dist/aweos-uefi.img
            dist/aweos-bios.img
          if-no-files-found: error
