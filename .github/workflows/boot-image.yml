name: AWEOS Boot Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Install boot image tools
        run: sudo apt-get update && sudo apt-get install -y grub-pc-bin grub-common xorriso
      - name: Build kernel
        run: cargo build --release -p aweos-kernel-bin --target x86_64-unknown-none
      - name: Validate ELF
        run: |
          file target/x86_64-unknown-none/release/aweos
          grub-file --is-x86-multiboot2 target/x86_64-unknown-none/release/aweos
      - name: Build ISO
        run: |
          mkdir -p dist/iso/boot/grub
          cp target/x86_64-unknown-none/release/aweos dist/iso/boot/aweos
          cp kernel-bin/grub.cfg dist/iso/boot/grub/grub.cfg
          grub-mkrescue -o dist/aweos-x86_64.iso dist/iso
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: aweos-x86_64-iso
          path: dist/aweos-x86_64.iso
