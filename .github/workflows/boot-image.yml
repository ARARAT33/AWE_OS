name: AWEOS Boot Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boot-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-boot-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-boot-cargo-
      - name: Prime Cargo cache
        run: cargo fetch
      - name: Install boot image and emulator tools
        run: sudo apt-get update && sudo apt-get install -y grub-pc-bin grub-common xorriso mtools qemu-system-x86
      - name: Build kernel
        env:
          AWEOS_QEMU_SMOKE: "1"
        run: cargo build --release -p aweos-kernel-bin --target x86_64-unknown-none --offline
      - name: Validate ELF
        run: |
          file target/x86_64-unknown-none/release/aweos
          grub-file --is-x86-multiboot2 target/x86_64-unknown-none/release/aweos
      - name: Build ISO
        run: |
          mkdir -p dist/iso/boot/grub
          cp target/x86_64-unknown-none/release/aweos dist/iso/boot/aweos
          cp kernel-bin/grub.cfg dist/iso/boot/grub/grub.cfg
          grub-mkrescue -o dist/aweos-x86_64.iso dist/iso
      - name: QEMU unattended boot smoke test
        id: qemu
        shell: bash
        run: |
          set +e
          timeout 15s qemu-system-x86_64 \
            -M q35 \
            -m 512M \
            -cdrom dist/aweos-x86_64.iso \
            -display none \
            -serial stdio \
            -no-reboot \
            -no-shutdown \
            -d guest_errors,cpu_reset \
            -D dist/qemu-debug.log \
            > dist/qemu.log 2>&1
          qemu_status=$?
          grep -q "AWEOS: boot protocol validated" dist/qemu.log
          boot_ok=$?
          grep -q "AWEOS: kernel state = RUNNING" dist/qemu.log
          running_ok=$?
          grep -q "AWEOS: kernel is alive" dist/qemu.log
          alive_ok=$?
          echo "qemu_status=$qemu_status" >> "$GITHUB_OUTPUT"
          echo "boot_ok=$boot_ok" >> "$GITHUB_OUTPUT"
          echo "running_ok=$running_ok" >> "$GITHUB_OUTPUT"
          echo "alive_ok=$alive_ok" >> "$GITHUB_OUTPUT"
          echo "--- serial/qemu output ---"
          cat dist/qemu.log
          echo "--- qemu debug output ---"
          cat dist/qemu-debug.log || true
          if [ "$qemu_status" -ne 124 ] && [ "$qemu_status" -ne 0 ]; then exit 1; fi
          if [ "$boot_ok" -ne 0 ] || [ "$running_ok" -ne 0 ] || [ "$alive_ok" -ne 0 ]; then exit 1; fi
      - name: Upload ISO and boot diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aweos-x86_64-iso
          path: |
            dist/aweos-x86_64.iso
            dist/qemu.log
            dist/qemu-debug.log
          if-no-files-found: warn
      - name: Boot diagnostics summary
        if: always()
        run: |
          echo "QEMU status: ${{ steps.qemu.outputs.qemu_status }}"
          echo "boot marker: ${{ steps.qemu.outputs.boot_ok }}"
          echo "running marker: ${{ steps.qemu.outputs.running_ok }}"
          echo "alive marker: ${{ steps.qemu.outputs.alive_ok }}"
