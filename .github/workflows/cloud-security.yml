name: AWEOS Cloud Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: aweos-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: aweos-${{ runner.os }}-
      - name: Prime Cargo cache
        run: cargo fetch
      - name: Format workspace
        run: cargo fmt --all -- --check
      - name: Compile every workspace crate
        run: cargo check --workspace --offline
      - name: Execute every workspace test
        id: tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-targets --no-fail-fast --offline -- --nocapture 2>&1 | tee workspace-tests.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: 90% package and recovery evidence
        if: steps.tests.outcome == 'success'
        run: cargo test -p awe-product-core-tests --offline -- --nocapture
      - name: Persistent storage runtime evidence
        if: steps.tests.outcome == 'success'
        run: cargo test -p awe-product-core-tests --offline -- --nocapture persistent_storage_runtime_round_trip_and_recovery
      - name: Network runtime evidence
        if: steps.tests.outcome == 'success'
        run: cargo test -p awe-product-core-tests --offline -- --nocapture network_runtime_socket_and_packet_validation
      - name: Upload workspace test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aweos-workspace-test-log
          path: workspace-tests.log
          if-no-files-found: warn
      - name: Security-focused tests
        if: steps.tests.outcome == 'success'
        run: cargo test --workspace --all-targets --offline -- security
      - name: Clippy diagnostics
        if: steps.tests.outcome == 'success'
        run: cargo clippy --workspace --all-targets --offline -- -D warnings -A dead_code -A unused_attributes -A bad_asm_style -A unused_imports
      - name: Dependency audit surface
        run: cargo tree --workspace --offline
      - name: Release blocker gate
        run: |
          set -eu
          if grep -RniE '\b(critical|high)\b[[:space:]]+(blocker|release blocker)' --exclude-dir=.git --exclude-dir=.github --exclude='*.lock' .; then
            echo 'High/critical release blocker marker found.'
            exit 1
          fi
          echo 'No high/critical release blocker marker found.'

  cloud-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: cloud-security
    steps:
      - uses: actions/checkout@v7
      - name: Verify release contract exists
        run: |
          test -f PRODUCT_READINESS.md
          test -f docs/AWE_CAPSULE.md
          test -f docs/AWE_XENOSENSE.md
          test -f docs/AWE_OS_100_PERCENT_MASTER_PLAN.md
          grep -q "Definition of done" PRODUCT_READINESS.md
          grep -q "AWE Capsule" docs/AWE_CAPSULE.md
