name: AWEOS Cloud Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: aweos-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: aweos-${{ runner.os }}-
      - name: Format workspace
        run: cargo fmt --all
      - name: Compile every workspace crate
        run: cargo check --workspace
      - name: Execute every workspace test
        id: tests
        shell: bash
        run: |
          set +e
          cargo test --workspace --all-targets --no-fail-fast -- --nocapture 2>&1 | tee workspace-tests.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload workspace test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aweos-workspace-test-log
          path: workspace-tests.log
      - name: Fail if workspace tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1
      - name: Security-focused tests
        run: cargo test --workspace --all-targets -- security
      - name: Clippy diagnostics
        run: cargo clippy --workspace --all-targets
      - name: Dependency audit surface
        run: cargo tree --workspace --locked

  cloud-release-contract:
    runs-on: ubuntu-latest
    needs: cloud-security
    steps:
      - uses: actions/checkout@v4
      - name: Verify release contract exists
        run: |
          test -f PRODUCT_READINESS.md
          test -f docs/AWE_CAPSULE.md
          test -f docs/AWE_XENOSENSE.md
          grep -q "Definition of done" PRODUCT_READINESS.md
          grep -q "AWE Capsule" docs/AWE_CAPSULE.md
