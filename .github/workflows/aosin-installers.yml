name: AOSIN Cross-Platform Installers (GUI & CLI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-installers:
    name: Build AOSIN Installers (Native OS Runners)
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: aosin-gui-installer-linux
            package: aosin-gui
            binary_name: aosin-gui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: aosin-gui-installer-windows.exe
            package: aosin-gui
            binary_name: aosin-gui.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: aosin-cli-installer-linux
            package: awe-cli
            binary_name: awe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: aosin-cli-installer-windows.exe
            package: awe-cli
            binary_name: awe.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        run: |
          rustup target add ${{ matrix.target }}

      - name: Build AOSIN Installer Binary
        run: cargo build --release -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Package Installer
        shell: bash
        run: |
          mkdir -p dist/installers
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/installers/${{ matrix.artifact_name }}

      - name: Upload AOSIN Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/installers/${{ matrix.artifact_name }}
          if-no-files-found: error
