name: AWEOS VirtIO Runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtio-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  virtio-block-contract-and-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-virtio-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-virtio-cargo-

      - name: Install QEMU and boot-image tools
        run: sudo apt-get update && sudo apt-get install -y grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Run storage and driver contract tests
        run: cargo test --workspace --all-targets --offline

      - name: Build kernel
        env:
          AWEOS_QEMU_SMOKE: "1"
        run: cargo build --release -p aweos-kernel-bin --target x86_64-unknown-none --offline

      - name: Validate kernel ELF
        run: |
          file target/x86_64-unknown-none/release/aweos
          grub-file --is-x86-multiboot2 target/x86_64-unknown-none/release/aweos

      - name: Build QEMU boot image
        run: |
          mkdir -p dist/iso/boot/grub
          cp target/x86_64-unknown-none/release/aweos dist/iso/boot/aweos
          cp kernel-bin/grub.cfg dist/iso/boot/grub/grub.cfg
          grub-mkrescue -o dist/aweos-x86_64.iso dist/iso
          truncate -s 64M dist/virtio-disk.img
          sha256sum dist/aweos-x86_64.iso dist/virtio-disk.img > dist/artifact-sha256.txt

      - name: Verify QEMU exposes VirtIO block transport
        run: |
          qemu-system-x86_64 -device help | grep -E '^name "virtio-blk-pci"'

      - name: QEMU boot with VirtIO block device
        shell: bash
        run: |
          set -e
          rm -f dist/qemu-virtio.qmp dist/qemu-virtio.log dist/qemu-virtio-debug.log
          qemu-system-x86_64 \
            -M q35 \
            -m 512M \
            -cdrom dist/aweos-x86_64.iso \
            -drive if=none,id=aweblk,format=raw,file=dist/virtio-disk.img \
            -device virtio-blk-pci,drive=aweblk \
            -display none \
            -serial file:dist/qemu-virtio.log \
            -qmp unix:dist/qemu-virtio.qmp,server=on,wait=off \
            -no-reboot \
            -no-shutdown \
            -d guest_errors,cpu_reset \
            -D dist/qemu-virtio-debug.log \
            > dist/qemu-host.log 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true; wait "$qemu_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            [ -S dist/qemu-virtio.qmp ] && break
            sleep 0.5
          done
          test -S dist/qemu-virtio.qmp

          python3 - <<'PY'
          import json
          import socket
          from pathlib import Path

          sock_path = Path("dist/qemu-virtio.qmp")
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(3)
          s.connect(str(sock_path))
          s.recv(65536)
          s.sendall((json.dumps({"execute": "qmp_capabilities"}) + "\r\n").encode())
          s.recv(65536)
          s.sendall((json.dumps({"execute": "query-pci"}) + "\r\n").encode())
          data = s.recv(262144).decode("utf-8", "replace")
          s.close()

          evidence = {
              "qmp_socket_present": True,
              "virtio_block": "virtio" in data.lower(),
              "query_pci_response": data,
          }
          Path("dist/qemu-device-evidence.json").write_text(json.dumps(evidence, indent=2))
          if not evidence["virtio_block"]:
              raise SystemExit("QEMU did not expose VirtIO evidence through QMP")
          PY

          sleep 3
          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          trap - EXIT

          cat dist/qemu-virtio.log || true
          cat dist/qemu-host.log || true
          cat dist/qemu-virtio-debug.log || true
          grep -q "AWEOS: boot protocol validated" dist/qemu-virtio.log
          grep -q "AWEOS: kernel state = RUNNING" dist/qemu-virtio.log
          grep -q "AWEOS: kernel is alive" dist/qemu-virtio.log

      - name: Publish VirtIO runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aweos-virtio-runtime-evidence
          path: |
            dist/aweos-x86_64.iso
            dist/virtio-disk.img
            dist/artifact-sha256.txt
            dist/qemu-virtio.log
            dist/qemu-host.log
            dist/qemu-virtio-debug.log
            dist/qemu-device-evidence.json
          if-no-files-found: warn
