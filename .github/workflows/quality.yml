name: AWEOS Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Root check
        run: cargo check --target x86_64-aweos.json
      - name: Kernel check
        run: cargo check --manifest-path kernel/Cargo.toml
      - name: Kernel clippy
        run: cargo clippy --manifest-path kernel/Cargo.toml --all-targets -- -D warnings

  bootloader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-uefi
      - name: Check AWE loader
        run: cargo check --manifest-path boot/aweloader/Cargo.toml --target x86_64-unknown-uefi
