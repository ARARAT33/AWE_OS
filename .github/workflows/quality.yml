name: AWEOS Quality Gate

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply canonical rustfmt
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: apply rustfmt"
            git push
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Workspace check
        run: cargo check --workspace

      - name: Workspace tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}

      - name: Apply automatic Clippy fixes
        if: steps.tests.outcome == 'success'
        run: |
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: apply clippy fixes"
            git push
          fi

      - name: Workspace Clippy
        if: steps.tests.outcome == 'success'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aweos-test-output-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: warn

  bootloader:
    name: UEFI loader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-uefi

      - name: Check AWE loader
        run: cargo check --manifest-path boot/aweloader/Cargo.toml --target x86_64-unknown-uefi
