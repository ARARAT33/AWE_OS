name: AWEOS Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format workspace
        run: cargo fmt --all
      - name: Workspace check
        run: cargo check --workspace
      - name: Workspace tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aweos-test-output-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: warn
      - name: Fail on test errors
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Workspace clippy diagnostics
        run: cargo clippy --workspace --all-targets
  bootloader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-uefi
      - name: Check AWE loader
        run: cargo check --manifest-path boot/aweloader/Cargo.toml --target x86_64-unknown-uefi
