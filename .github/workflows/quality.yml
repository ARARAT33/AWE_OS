name: AWEOS Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Workspace check
        run: cargo check --workspace --offline

      - name: Workspace tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast --offline 2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aweos-test-output-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: warn

      - name: Workspace Clippy
        if: steps.tests.outcome == 'success'
        run: cargo clippy --workspace --all-targets --offline -- -D warnings -A dead_code -A unused_attributes -A bad_asm_style -A unused_imports

  bootloader:
    name: UEFI loader
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-uefi

      - name: Check AWE loader
        run: cargo check --manifest-path boot/aweloader/Cargo.toml --target x86_64-unknown-uefi --offline
