[workspace]
members = [
    "boot/protocol",
    "boot/aweloader",
    "kernel",
    "kernel-bin",
    "services/driverd",
    "tools/aweosa-builder",
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
awe-boot-protocol = { path = "boot/protocol" }
awe-driverd = { path = "services/driverd" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
