[package]
name = "aweos-kernel-bin"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "aweos"
path = "src/main.rs"

[dependencies]
aweos-kernel = { path = "../kernel" }
awe-boot-protocol = { workspace = true }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
